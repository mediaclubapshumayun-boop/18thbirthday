<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zash's 18th Birthday Feast!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-wrapper">
        <header>
            <h1>ZASH'S 18TH BIRTHDAY FEAST!</h1>
        </header>

        <div class="controls">
            <button id="micBtn" class="pixel-button">🎤 Enable Mic to Blow Candles</button>
            <p id="micStatus" class="mic-status">Click button to enable mic or tap the cake directly!</p>
        </div>

        <!-- Main Scene Container -->
        <div class="scene-container">
            <img src="bg.jpg" alt="Harry Potter Birthday Room" id="bgImage">

            <!-- Cake in Center Table -->
            <div class="cake-wrapper" id="cakeContainer" title="Click to blow candles!">
                <img src="cake.png" alt="Birthday Cake" class="cake-image">
                
                <!-- Candle Flames mapped to cake candles -->
                <div class="flame-group">
                    <div class="candle-flame" style="top: 8%; left: 49.5%;"></div>
                    <div class="candle-flame" style="top: 41%; left: 34.5%;"></div>
                    <div class="candle-flame" style="top: 45%; left: 43.2%;"></div>
                    <div class="candle-flame" style="top: 47%; left: 50.8%;"></div>
                    <div class="candle-flame" style="top: 45%; left: 58.2%;"></div>
                    <div class="candle-flame" style="top: 41%; left: 66.0%;"></div>
                </div>

                <!-- Smoke Animation Element -->
                <div class="smoke-container" id="smokeEffect">
                    <div class="smoke-puff"></div>
                    <div class="smoke-puff"></div>
                    <div class="smoke-puff"></div>
                </div>
            </div>

            <!-- Floating Interactive Balloons -->
            <div class="interactive balloon float-1" id="balloon1" style="top: 12%; left: 15%;"></div>
            <div class="interactive balloon float-2" id="balloon2" style="top: 22%; left: 8%;"></div>
            <div class="interactive balloon float-3" id="balloon3" style="top: 35%; left: 18%;"></div>
            <div class="interactive balloon float-1" id="balloon4" style="top: 12%; left: 78%;"></div>
            <div class="interactive balloon float-2" id="balloon5" style="top: 24%; left: 86%;"></div>
            <div class="interactive balloon float-3" id="balloon6" style="top: 38%; left: 76%;"></div>

            <!-- 8 Interactive Gift Boxes -->
            <div class="gift-grid">
                <div class="gift-box" id="gift1" data-wish="✨ May your 18th year be filled with pure magic, joy, and endless spells of victory!">
                    <div class="gift-lid">🎁</div>
                    <div class="gift-label">Gift #1</div>
                </div>
                <div class="gift-box" id="gift2" data-wish="🦉 A special Hogwarts owl brought this: Have a fantastic 18th Birthday Zash!">
                    <div class="gift-lid">🎁</div>
                    <div class="gift-label">Gift #2</div>
                </div>
                <div class="gift-box" id="gift3" data-wish="⚡ Accio happiness! May all your dreams and magical ambitions come true this year!">
                    <div class="gift-lid">🎁</div>
                    <div class="gift-label">Gift #3</div>
                </div>
                <div class="gift-box" id="gift4" data-wish="🏆 100 points to Gryffindor for being an amazing friend! Happy 18th Birthday!">
                    <div class="gift-lid">🎁</div>
                    <div class="gift-label">Gift #4</div>
                </div>
                <div class="gift-box" id="gift5" data-wish="🧪 Wishing you a year brewed with success, good health, and wonderful adventures!">
                    <div class="gift-lid">🎁</div>
                    <div class="gift-label">Gift #5</div>
                </div>
                <div class="gift-box" id="gift6" data-wish="🧹 May you fly high toward your ultimate goals and catch every Golden Snitch in life!">
                    <div class="gift-lid">🎁</div>
                    <div class="gift-label">Gift #6</div>
                </div>
                <div class="gift-box" id="gift7" data-wish="🔮 The Marauder's Map reveals: A grand year of happiness lies ahead for Zash!">
                    <div class="gift-lid">🎁</div>
                    <div class="gift-label">Gift #7</div>
                </div>
                <div class="gift-box" id="gift8" data-wish="🌟 Mischief Managed! Cheers to 18 years of incredible memories and many more to come!">
                    <div class="gift-lid">🎁</div>
                    <div class="gift-label">Gift #8</div>
                </div>
            </div>
        </div>

        <!-- Wish Modal -->
        <div id="wishModal" class="modal hidden">
            <div class="modal-content pixel-frame">
                <span id="closeModal" class="close">&times;</span>
                <h2>🎁 A Birthday Wish for Zash! 🎁</h2>
                <p id="wishText"></p>
            </div>
        </div>

        <footer>
            <p>Click Balloons to Pop | Click Gifts to Open | Blow Mic or Click Cake to Blow Candles</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
