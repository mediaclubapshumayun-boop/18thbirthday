<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zash's 28th Birthday Feast!</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="wrapper">
    <div class="header-banner">
      <h1>ZASH'S 28TH BIRTHDAY FEAST!</h1>
    </div>

    <div class="mic-status-container">
      <button id="micBtn" class="pixel-btn">🎤 Enable Mic to Blow Candles</button>
      <span id="micStatusText">Click button to allow mic</span>
    </div>

    <!-- Main Scene Canvas -->
    <div class="room-container">
      <canvas id="roomCanvas" width="800" height="500"></canvas>
    </div>

    <!-- Wish Modal Popup for Gifts -->
    <div id="wishModal" class="modal hidden">
      <div class="modal-content">
        <span id="closeModal" class="close-btn">&times;</span>
        <h2>🎁 Magical Wish 🎁</h2>
        <p id="wishText"></p>
      </div>
    </div>

    <div class="footer-note">
      <p>🎈 Click Balloons to POP | 🎁 Click Gifts to OPEN | 🎤 Blow into Mic for Candles</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
