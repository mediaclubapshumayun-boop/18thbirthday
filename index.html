<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zash's 28th Birthday Feast!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-wrapper">
        <header>
            <h1>ZASH'S 28TH BIRTHDAY FEAST!</h1>
        </header>

        <div class="controls">
            <button id="micBtn" class="pixel-button">🎤 Enable Mic to Blow Candles</button>
            <p id="micStatus" class="mic-status">Mic not enabled.</p>
        </div>

        <div class="scene-container">
            <canvas id="birthdayCanvas" width="800" height="500"></canvas>
        </div>

        <!-- Gift Wish Modal -->
        <div id="wishModal" class="modal hidden">
            <div class="modal-content pixel-frame">
                <span id="closeModal" class="close">&times;</span>
                <h2>🎁 A Birthday Wish for Zash! 🎁</h2>
                <p id="wishText"></p>
            </div>
        </div>

        <footer>
            <p>Click Balloons to Pop | Click Gifts to Open | Blow Mic to Blow Candles</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
