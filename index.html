<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday! 🎂</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Firestore (v9 Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Main Fixed Pixel Room Viewport -->
    <div id="room-container">
        <div id="room">
            
            <!-- Ceiling Rafters & String Lights -->
            <div class="rafters"></div>
            <div class="garland-left"></div>
            <div class="garland-right"></div>
            <div class="star-lights">
                <span class="star-light s1">★</span>
                <span class="star-light s2">★</span>
                <span class="star-light s3">★</span>
                <span class="star-light s4">★</span>
            </div>

            <!-- Arched Happy Birthday Banner -->
            <div class="banner-container">
                <div class="bday-banner">
                    <span>H</span><span>A</span><span>P</span><span>P</span><span>Y</span>
                    &nbsp;
                    <span>B</span><span>I</span><span>R</span><span>T</span><span>H</span><span>D</span><span>A</span><span>Y</span><span>!</span>
                </div>
            </div>

            <!-- Center Night Sky Window -->
            <div class="window-frame">
                <div class="night-sky">
                    <div class="moon">🌙</div>
                    <div class="pixel-star st1">✦</div>
                    <div class="pixel-star st2">✦</div>
                    <div class="pixel-star st3">✦</div>
                    <div class="city-lights"></div>
                </div>
                <div class="curtain curtain-left"></div>
                <div class="curtain curtain-right"></div>
            </div>

            <!-- Left Wall Decor & Tripod Camera -->
            <div class="wall-decor-left">
                <div class="pixel-frame f1">🖼️</div>
                <div class="pixel-frame f2">🖼️</div>
                <div class="photo-booth">
                    <div class="camera-body">📷</div>
                    <div class="tripod-legs"></div>
                </div>
            </div>

            <!-- Right Wall Shelf -->
            <div class="wall-decor-right">
                <div class="shelf">
                    <span class="plant">🪴</span>
                    <span class="jar">🫙</span>
                </div>
            </div>

            <!-- Floating Room Balloons -->
            <div class="balloon balloon-pink">🎈</div>
            <div class="balloon balloon-yellow">🎈</div>
            <div class="balloon balloon-purple">🎈</div>
            <div class="balloon balloon-heart">💖</div>
            <div class="balloon balloon-green">🎈</div>

            <!-- Stacks of Gifts (Left Floor) -->
            <div class="gifts-left">
                <div class="gift-box gift-0" data-index="0">
                    <div class="gift-lid"></div>
                    <div class="gift-body">🎁</div>
                </div>
                <div class="gift-box gift-1" data-index="1">
                    <div class="gift-lid"></div>
                    <div class="gift-body">🎁</div>
                </div>
            </div>

            <!-- Blue Rug & Central Banquet Table -->
            <div class="blue-carpet">
                
                <!-- Rear Chairs -->
                <div class="chair chair-back-left">🪑</div>
                <div class="chair chair-back-right">🪑</div>

                <!-- Dining Table -->
                <div class="dining-table">
                    <div class="table-items">
                        <div class="dessert-tier">🧁</div>
                        
                        <!-- Interative Birthday Cake -->
                        <div class="cake-wrapper" id="cake-trigger">
                            <div class="candles-container" id="candles">
                                <span class="flame f-1">🔥</span>
                                <span class="flame f-2">🔥</span>
                                <span class="flame f-3">🔥</span>
                            </div>
                            <div class="cake-graphic">🎂</div>
                        </div>

                        <div class="flower-vase">💐</div>
                        <div class="drinks">🍹</div>
                    </div>
                </div>

                <!-- Front Chairs with Pink Bows -->
                <div class="chair chair-front-left">🎀</div>
                <div class="chair chair-front-right">🎀</div>

                <!-- Orange Pixel Cat in Foreground -->
                <div class="pixel-cat">🐈</div>
            </div>

            <!-- Stacks of Gifts (Right Floor) -->
            <div class="gifts-right">
                <div class="gift-box gift-2" data-index="2">
                    <div class="gift-lid"></div>
                    <div class="gift-body">🎁</div>
                </div>
                <div class="gift-box gift-3" data-index="3">
                    <div class="gift-lid"></div>
                    <div class="gift-body">🎁</div>
                </div>
                <div class="gift-box gift-4" data-index="4">
                    <div class="gift-lid"></div>
                    <div class="gift-body">🎁</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Minimal Audio Toggle Button -->
    <button id="audio-toggle" class="pixel-audio-btn" aria-label="Toggle Audio">🎵</button>

    <!-- Message Modal Overlay (Gift Unboxing) -->
    <div id="message-modal" class="pixel-modal hidden">
        <div class="pixel-dialog">
            <div class="pixel-dialog-header">
                <span>💌 A little message for you</span>
            </div>
            <div id="modal-text" class="pixel-dialog-body">
                <!-- Message injected here -->
            </div>
            <button id="close-message-btn" class="pixel-btn">CLOSE</button>
        </div>
    </div>

    <!-- Candle Blowing Modal Overlay -->
    <div id="cake-modal" class="pixel-modal hidden">
        <div class="pixel-dialog">
            <div class="pixel-dialog-header">
                <span id="cake-modal-title">Make a wish... 🎂</span>
            </div>
            <div class="pixel-dialog-body">
                <p id="mic-status-text">Blow into your microphone or press the button to extinguish the candles!</p>
                <div id="blow-indicator" class="blow-bar-container hidden">
                    <div id="blow-bar-fill" class="blow-bar-fill"></div>
                </div>
            </div>
            <div class="pixel-dialog-footer">
                <button id="manual-blow-btn" class="pixel-btn highlight-btn">BLOW OUT CANDLES 🕯️</button>
                <button id="close-cake-btn" class="pixel-btn">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="bg-music" loop src="assets/music/cozy_pixel_birthday.mp3"></audio>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
