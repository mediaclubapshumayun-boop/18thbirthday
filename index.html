<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Birthday Party Room 🎂</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Main Game Viewport -->
    <div id="game-container">
        <div id="room">
            <!-- Roof Rafters & Hanging Decor -->
            <div class="rafters"></div>
            <div class="garland"></div>
            <div class="hanging-stars">
                <span>★</span><span>★</span><span>★</span><span>★</span>
            </div>

            <!-- Happy Birthday Banner -->
            <div class="banner-wrapper">
                <div class="bday-banner">HAPPY BIRTHDAY!</div>
            </div>

            <!-- Center Window & Night View -->
            <div class="window">
                <div class="sky">
                    <div class="moon">🌙</div>
                    <div class="stars">✦ &nbsp; ✦ &nbsp; ✦</div>
                </div>
                <div class="curtain curtain-l"></div>
                <div class="curtain curtain-r"></div>
            </div>

            <!-- Left Wall Props (Tripod Camera) -->
            <div class="wall-left">
                <div class="pixel-frame">🖼️</div>
                <div class="retro-camera">📸</div>
            </div>

            <!-- Right Wall Shelf -->
            <div class="wall-right">
                <div class="shelf">🪴 🫙</div>
            </div>

            <!-- Floating Balloons -->
            <div class="balloon b-1">🎈</div>
            <div class="balloon b-2">💖</div>
            <div class="balloon b-3">🎈</div>
            <div class="balloon b-4">🎈</div>

            <!-- Stacks of Interactive Presents (Left Floor) -->
            <div class="gift-stack gift-stack-left" id="gifts-left-container">
                <!-- Injected via JavaScript/Firebase -->
            </div>

            <!-- Carpet & Center Table Setup -->
            <div class="blue-rug">
                <!-- Side/Back Chairs -->
                <div class="chair chair-l">🪑</div>
                <div class="chair chair-r">🪑</div>

                <!-- Dining Table with Gingham Tablecloth -->
                <div class="table">
                    <div class="table-feast">
                        <span class="cupcakes">🧁</span>
                        
                        <!-- Interactive Birthday Cake -->
                        <div class="cake" id="cake-trigger">
                            <div class="candles" id="candles-flame">🔥 🔥 🔥</div>
                            <div class="cake-body">🎂</div>
                        </div>

                        <span class="flower-pot">🌸</span>
                        <span class="juice">🍹</span>
                    </div>
                </div>

                <!-- Front Chairs with Bows -->
                <div class="chair chair-f1">🎀</div>
                <div class="chair chair-f2">🎀</div>

                <!-- Pixel Orange Cat -->
                <div class="cat">🐈</div>
            </div>

            <!-- Stacks of Interactive Presents (Right Floor) -->
            <div class="gift-stack gift-stack-right" id="gifts-right-container">
                <!-- Injected via JavaScript/Firebase -->
            </div>
            
            <!-- Floating "Leave a Present" Button -->
            <button id="add-gift-btn" class="pixel-btn leave-gift-btn">🎁 LEAVE A PRESENT</button>
        </div>
    </div>

    <!-- Minimal Audio Controls -->
    <button id="audio-btn" class="pixel-btn audio-toggle">🎵</button>

    <!-- ========================================== -->
    <!-- MODAL 1: VIEW PRESENT (Matches Image 3)    -->
    <!-- ========================================== -->
    <div id="view-present-modal" class="pixel-modal hidden">
        <div class="present-card-container">
            <div class="card-header-pink">
                <span class="header-sub">A PRESENT FROM</span>
                <h2 id="card-sender-name">Friend Name</h2>
                <button class="close-card-x" id="close-view-btn">✕</button>
            </div>
            
            <div class="card-content-split">
                <!-- Left: Handwritten Letter Note -->
                <div class="letter-box">
                    <div class="tab-label">LETTER</div>
                    <p id="card-letter-text">You better have a good day!</p>
                </div>
                
                <!-- Right: Polaroid Photo Attachment -->
                <div class="photo-box">
                    <div class="tab-label">PHOTO</div>
                    <div class="polaroid-frame">
                        <img id="card-photo-img" src="" alt="Memory Photo" />
                    </div>
                </div>
            </div>
            
            <button class="pixel-btn card-close-btn" id="close-card-btn">CLOSE</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL 2: LEAVE A PRESENT (Matches Image 2)  -->
    <!-- ========================================== -->
    <div id="create-present-modal" class="pixel-modal hidden">
        <div class="wrapping-station-box">
            <div class="station-header">
                <h3>PICK THE WRAPPING</h3>
                <span class="step-text">STEP 1 OF 1</span>
            </div>

            <div class="preview-present-display">
                <div id="wrap-preview-icon" class="big-gift-preview wrap-pink-hearts">🎁</div>
                <div id="wrap-selected-name" class="wrap-name-label">PINK HEARTS</div>
            </div>

            <!-- Wrapping Selector Grid -->
            <div class="wrap-options-grid">
                <button class="wrap-option active" data-style="wrap-pink-hearts" data-name="PINK HEARTS">🎁</button>
                <button class="wrap-option" data-style="wrap-blue-squares" data-name="BLUE SQUARES">🎁</button>
                <button class="wrap-option" data-style="wrap-purple-dots" data-name="PURPLE DOTS">🎁</button>
                <button class="wrap-option" data-style="wrap-gingham" data-name="PINK GINGHAM">🎁</button>
                <button class="wrap-option" data-style="wrap-black-white" data-name="MONOCHROME">🎁</button>
            </div>

            <!-- Inputs for Letter & Photo -->
            <div class="present-form-inputs">
                <input type="text" id="input-sender" placeholder="Your Name" maxlength="20" />
                <textarea id="input-message" placeholder="Write your birthday letter..." rows="3"></textarea>
                <input type="url" id="input-photo-url" placeholder="Photo URL (optional)" />
            </div>

            <div class="station-actions">
                <button id="cancel-wrap-btn" class="pixel-btn">BACK</button>
                <button id="submit-wrap-btn" class="pixel-btn highlight-btn">WRAP IT UP!</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL 3: CAKE & CANDLE BLOWING              -->
    <!-- ========================================== -->
    <div id="cake-modal" class="pixel-modal hidden">
        <div class="simple-pixel-dialog">
            <h3>Make a wish... 🎂</h3>
            <p id="cake-mic-status">Blow into your microphone or press the button below!</p>
            <div class="dialog-buttons">
                <button id="blow-candles-btn" class="pixel-btn highlight-btn">BLOW OUT CANDLES 🕯️</button>
                <button id="close-cake-btn" class="pixel-btn">CANCEL</button>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop src="assets/music/cozy_pixel_birthday.mp3"></audio>

    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
