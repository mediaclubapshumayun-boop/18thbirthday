<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Birthday Party Room 🎂</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-viewport">
        <!-- Pixel Art Engine Canvas -->
        <canvas id="room-canvas" width="600" height="400"></canvas>

        <!-- Bottom Action Button -->
        <button id="add-gift-btn" class="pixel-btn leave-gift-btn">🎁 LEAVE A PRESENT</button>
    </div>

    <!-- Microphone & Interaction Status Bar -->
    <div id="mic-status-bar" class="mic-status">
        🎤 Click the <strong>Birthday Cake</strong> to enable mic detection and blow out candles!
    </div>

    <!-- ========================================== -->
    <!-- MODAL 1: VIEW PRESENT CARD                 -->
    <!-- ========================================== -->
    <div id="view-present-modal" class="pixel-modal hidden">
        <div class="present-card-container">
            <div class="card-header-pink">
                <span class="header-sub">A PRESENT FROM</span>
                <h2 id="card-sender-name">Friend Name</h2>
                <button class="close-card-x" id="close-view-x">✕</button>
            </div>
            
            <div class="card-content-split">
                <!-- Left: Letter -->
                <div class="letter-box">
                    <div class="tab-label">LETTER</div>
                    <p id="card-letter-text">Happy Birthday!</p>
                </div>
                
                <!-- Right: Polaroid Photo -->
                <div class="photo-box">
                    <div class="tab-label">PHOTO</div>
                    <div class="polaroid-frame">
                        <img id="card-photo-img" src="" alt="Memory Photo" />
                    </div>
                </div>
            </div>
            
            <button class="pixel-btn card-close-btn" id="close-card-btn">CLOSE</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL 2: LEAVE A PRESENT (WRAPPING)        -->
    <!-- ========================================== -->
    <div id="create-present-modal" class="pixel-modal hidden">
        <div class="wrapping-station-box">
            <div class="station-header">
                <h3>PICK THE WRAPPING</h3>
                <span class="step-text">STEP 1 OF 1</span>
            </div>

            <div class="preview-present-display">
                <div id="wrap-preview-icon" class="big-gift-preview">🎁</div>
                <div id="wrap-selected-name" class="wrap-name-label">PINK HEARTS</div>
            </div>

            <!-- Wrapping Selector Grid -->
            <div class="wrap-options-grid">
                <button class="wrap-option active" data-color="#ff70a6" data-ribbon="#ffffff" data-name="PINK HEARTS">🎁</button>
                <button class="wrap-option" data-color="#3a86ff" data-ribbon="#ffbe0b" data-name="BLUE SQUARES">🎁</button>
                <button class="wrap-option" data-color="#8338ec" data-ribbon="#ff70a6" data-name="PURPLE DOTS">🎁</button>
                <button class="wrap-option" data-color="#ff006e" data-ribbon="#3a86ff" data-name="HOT PINK">🎁</button>
                <button class="wrap-option" data-color="#fb5607" data-ribbon="#ffbe0b" data-name="SUNBURST">🎁</button>
            </div>

            <!-- Present Inputs -->
            <div class="present-form-inputs">
                <input type="text" id="input-sender" placeholder="Your Name" maxlength="20" />
                <textarea id="input-message" placeholder="Write your birthday letter..." rows="3"></textarea>
                <input type="url" id="input-photo-url" placeholder="Photo URL (e.g. image link)" />
            </div>

            <div class="station-actions">
                <button id="cancel-wrap-btn" class="pixel-btn">BACK</button>
                <button id="submit-wrap-btn" class="pixel-btn highlight-btn">WRAP IT UP!</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
